input { file { path => "/data/uploads/json/*.json" mode => "tail" start_position => "beginning" sincedb_path => "/usr/share/logstash/data/sincedb_json" } }
filter { json { source => "message" tag_on_failure => ["_jsonparsefailure"] } }
filter {
  ruby { code => 'event.set("file_id", File.basename(event.get("path").to_s).split("__")[0])' }
  date { match => ["timestamp","ISO8601","yyyy-MM-dd HH:mm:ss"] target => "@timestamp" tag_on_failure => ["_dateparsefailure"] }
  mutate { uppercase => ["level"] }
  mutate { convert => { "amount" => "float" "response_ms" => "integer" } }
  if [client_ip] and [client_ip] != "" { geoip { source => "client_ip" target => "geoip" } }
  mutate { remove_field => ["timestamp","host","path","log"] }
}
output {
  if "_csvparsefailure" in [tags] or "_jsonparsefailure" in [tags] or "_grokparsefailure" in [tags] or "_dateparsefailure" in [tags] {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "shopflow-failures-%{+YYYY.MM.dd}" ilm_enabled => false manage_template => false }
  } else {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "shopflow-logs-%{+YYYY.MM.dd}" ilm_enabled => false manage_template => false }
  }
}
